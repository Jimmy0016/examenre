name: "CI/CD Pipeline"

on:
  push:
    branches:
      - espinoza
  pull_request:

#  Esto ayuda a dar permisos, pero el cambio clave está más abajo
permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    #  Descargar el código del repositorio
    - name: "Checkout repository"
      uses: actions/checkout@v3

    # ✅ Configurar Python 3.10
    - name: "Set up Python"
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    # Instalar dependencias
    - name: "Install dependencies"
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    #  Ejecutar 
    - name: "Run tests"
      run: |
       echo ">>> Ejecutando pruebas con PyTest..."
       export PYTHONPATH=$PYTHONPATH:$(pwd)
       pytest -v --maxfail=1

    # Login en GitHub Container Registry
    # AQUÍ ESTABA EL ERROR: Usamos GHCR_PAT en vez de GITHUB_TOKEN
    - name: "Login to GHCR"
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GHCR_PAT }}  # <--- CAMBIO IMPORTANTE

    # Construir y subir la imagen Docker
    - name: "Build and push Docker image"
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: ghcr.io/jimmy0016/jimmy:1.0.5
      
    # Verificar conexión SSH
    - name: Pruebas de SSH con el servidor
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.VPS_HOST }}
        port: ${{ secrets.VPS_SSH_PORT }}
        username: ${{ secrets.VPS_USER }}
        password: ${{ secrets.VPS_PASSWORD }}
        script: |
            echo " Conexión exitosa desde GitHub Actions"
            mkdir -p ~/AUTOMATIZAR

    #  Copiar stack.yml al servidor
    - name: Pasar el stack.yml al servidor
      uses: appleboy/scp-action@v1
      with:
        host: ${{ secrets.VPS_HOST }}
        port: ${{ secrets.VPS_SSH_PORT }}
        username: ${{ secrets.VPS_USER }}
        password: ${{ secrets.VPS_PASSWORD }}
        source: "stack.yml"
        target: "/home/${{ secrets.VPS_USER }}/recuperacion"
    
    #  Despliegue en Docker Swarm
    - name: Deploy del servicio
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.VPS_HOST }}
        port: ${{ secrets.VPS_SSH_PORT }}
        username: ${{ secrets.VPS_USER }}
        password: ${{ secrets.VPS_PASSWORD }}
        script: |
            cd ~/recuperacion
            
            echo " Iniciando despliegue..."
            
            # Login en el servidor remoto
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u Jimmy0016 --password-stdin
            
            # Descargar la imagen explícitamente
            docker pull ghcr.io/jimmy0016/jimmy:1.0.5

            docker stack rm rugal || true
            sleep 10
            # Despliegue
            docker stack deploy --with-registry-auth --resolve-image always -c stack.yml rugal
            
            echo "Despliegue enviado a Swarm."
            
          
       
            docker service ls