name: "CI/CD Pipeline"

on:
  push:
    branches:
      - Jordy
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # ✅ Descargar el código del repositorio
    - name: "Checkout repository"
      uses: actions/checkout@v3

    # ✅ Configurar Python 3.10
    - name: "Set up Python"
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    # ✅ Instalar dependencias
    - name: "Install dependencies"
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # ✅ Ejecutar pruebas
    - name: Run tests
      run: |
        export PYTHONPATH=$PYTHONPATH:$(pwd)
        pytest tests

    # ✅ Linter para calidad de código
    - name: "Run lint"
      run: flake8 .

    # ✅ Login en GitHub Container Registry
    - name: "Login to GHCR"
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # ✅ Construir y subir la imagen Docker
    - name: "Build and push Docker image"
      uses: docker/build-push-action@v4
      with:
        push: true
        tags: ghcr.io/jordysz/jordy_sanchez_taller:latest
     
    - name: pruebas de shh con el servidor
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.VPS_HOST }}
        port: ${{ secrets.VPS_SSH_PORT }}
        username: ${{ secrets.VPS_USER }}
        password: ${{ secrets.VPS_PASSWORD }}
        script: |
            echo "conexion exitosa desde Githud Actions"
            pwd
            whoami
            hostname
            uptime

    - name: Pasar el stack.yml al servidot
      uses: appleboy/scp-action@v1
      with:
        host: ${{ secrets.VPS_HOST }}
        port: ${{ secrets.VPS_SSH_PORT }}
        username: ${{ secrets.VPS_USER }}
        password: ${{ secrets.VPS_PASSWORD }}
        source: "stack.yml"
        target: "/home/${{secrets.VPS_USER}}/AUTOMATIZAR"
   
    - name: deploy del servicio
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.VPS_HOST }}
        port: ${{ secrets.VPS_SSH_PORT }}
        username: ${{ secrets.VPS_USER }}
        password: ${{ secrets.VPS_PASSWORD }}
        script: |
            echo "deloyando los servicio"
            cd ~/AUTOMATIZAR

            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u JordySZ --password-stdin
            docker pull ghcr.io/jordysz/jordy_sanchez_taller:latest

            # Borrar el stack SIEMPRE (si no existe no falla)
            docker stack rm doraemon || true

            # Timpo de espera hasta que bajen los servicios
            sleep 40

            docker stack deploy --with-registry-auth -c stack.yml doraemon

            sleep 30
            # Ver los servicios
            docker ps 